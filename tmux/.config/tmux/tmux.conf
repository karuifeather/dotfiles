# ============================================================
# TMUX CONFIGURATION
# Managed with GNU Stow: ~/dotfiles/tmux
# ============================================================


# ------------------------------------------------------------
# General
# ------------------------------------------------------------

# Start window and pane numbering at 1.
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows after closing one.
set -g renumber-windows on

# Enable mouse selection, scrolling, and resizing.
set -g mouse on

# Increase scrollback history.
set -g history-limit 50000

# Reduce delay after Escape, useful for Neovim.
set -sg escape-time 10

# Enable true-color and modern terminal capabilities.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"


# ------------------------------------------------------------
# Pane navigation (no prefix required)
# ------------------------------------------------------------

# Alt + h/j/k/l: navigate between panes.
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Prefix + h/j/k/l: fallback navigation.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


# ------------------------------------------------------------
# Splitting panes
# ------------------------------------------------------------

# Prefix + v: split left/right.
# Prefix + s: split top/bottom.
# New panes inherit the current pane's working directory.
unbind %
unbind '"'

bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"


# ------------------------------------------------------------
# Resizing panes
# ------------------------------------------------------------

# Prefix + Shift + h/j/k/l.
# Repeat keys without pressing the prefix again.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5


# ------------------------------------------------------------
# Windows
# ------------------------------------------------------------

# Create windows in the current working directory.
bind c new-window -c "#{pane_current_path}"

# Alt + u/i: previous/next window.
bind -n M-u previous-window
bind -n M-i next-window


# ------------------------------------------------------------
# Copy mode
# ------------------------------------------------------------

# Vim-style navigation in copy mode.
setw -g mode-keys vi

# Use v to begin selecting text.
bind -T copy-mode-vi v send-keys -X begin-selection

# Use y to copy selected text.
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel


# ------------------------------------------------------------
# Quality of life
# ------------------------------------------------------------

# Prefix + z: zoom/unzoom pane (tmux default).

# Prefix + r: reload this configuration.
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux configuration reloaded"
